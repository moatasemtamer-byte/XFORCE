name: Deploy

# Ships both Railway services after CI passes on main. Requires the RAILWAY_TOKEN account
# secret (Railway → Account Settings → Tokens) with permission to deploy this project; if
# the secret is not configured the run skips cleanly instead of failing, so deploys stay
# manual (railway up) until the secret is added.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check for the Railway token
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RAILWAY_TOKEN is not configured; skipping deploy. Set it in repo secrets to enable auto-deploy."
          fi

      - name: Install Railway CLI
        if: steps.token.outputs.present == 'true'
        run: npm install -g @railway/cli

      - name: Deploy engine
        if: steps.token.outputs.present == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        timeout-minutes: 25
        run: railway up --service engine --environment production --ci

      - name: Deploy web
        if: steps.token.outputs.present == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        timeout-minutes: 25
        run: railway up --service web --environment production --ci

      - name: Wait for the web service and check health
        if: steps.token.outputs.present == 'true'
        timeout-minutes: 10
        run: |
          url="${{ vars.MSW_WEB_URL || 'https://web-production-951a17.up.railway.app' }}"
          for i in $(seq 1 40); do
            if curl -sf "$url/api/engine/health" | grep -q '"available":true'; then
              echo "deploy healthy"
              exit 0
            fi
            sleep 15
          done
          echo "web did not report a healthy engine within 10 minutes" >&2
          exit 1
